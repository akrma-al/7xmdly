{% extends "base.html" %}
{% block title %}إنشاء حساب - دليلي الدوائي{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-dark-800 rounded-xl border border-dark-600 p-8">
        <div class="text-center mb-6">
            <span class="text-4xl">&#128138;</span>
            <h1 class="text-2xl font-bold text-white mt-2">إنشاء حساب جديد</h1>
            <p class="text-gray-400 text-sm mt-1">ابدأ رحلتك الصحية مع دليلي الدوائي</p>
        </div>
        <form method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">اسم المستخدم</label>
                    <input type="text" name="username" required minlength="3"
                        class="w-full bg-dark-700 border border-dark-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-accent-500 focus:outline-none"
                        placeholder="3 أحرف على الأقل">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" name="email" required
                        class="w-full bg-dark-700 border border-dark-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-accent-500 focus:outline-none"
                        placeholder="example@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" name="password" required minlength="6"
                        class="w-full bg-dark-700 border border-dark-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-accent-500 focus:outline-none"
                        placeholder="6 أحرف على الأقل">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">تأكيد كلمة المرور</label>
                    <input type="password" name="confirm_password" required
                        class="w-full bg-dark-700 border border-dark-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-accent-500 focus:outline-none"
                        placeholder="أعد إدخال كلمة المرور">
                </div>
                <button type="submit" class="w-full bg-accent-500 hover:bg-accent-600 text-white px-4 py-2.5 rounded-lg font-bold transition">
                    إنشاء الحساب
                </button>
            </div>
        </form>
        <div class="mt-6 text-center">
            <p class="text-gray-500 text-sm">
                لديك حساب بالفعل؟
                <a href="{{ url_for('auth.login') }}" class="text-accent-400 hover:text-accent-300 font-medium transition">سجّل الدخول</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
