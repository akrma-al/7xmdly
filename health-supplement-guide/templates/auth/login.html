{% extends "base.html" %}
{% block title %}تسجيل الدخول - دليلي الدوائي{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="bg-dark-800 rounded-xl border border-dark-600 p-8">
        <div class="text-center mb-6">
            <span class="text-4xl">&#128138;</span>
            <h1 class="text-2xl font-bold text-white mt-2">تسجيل الدخول</h1>
            <p class="text-gray-400 text-sm mt-1">مرحباً بعودتك إلى دليلي الدوائي</p>
        </div>
        <form method="POST">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">اسم المستخدم</label>
                    <input type="text" name="username" required
                        class="w-full bg-dark-700 border border-dark-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-accent-500 focus:outline-none"
                        placeholder="أدخل اسم المستخدم">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" name="password" required
                        class="w-full bg-dark-700 border border-dark-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-accent-500 focus:outline-none"
                        placeholder="أدخل كلمة المرور">
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" name="remember" id="remember"
                        class="w-4 h-4 rounded bg-dark-700 border-dark-600 text-accent-500 focus:ring-accent-500">
                    <label for="remember" class="text-sm text-gray-400">تذكرني</label>
                </div>
                <button type="submit" class="w-full bg-accent-500 hover:bg-accent-600 text-white px-4 py-2.5 rounded-lg font-bold transition">
                    تسجيل الدخول
                </button>
            </div>
        </form>
        <div class="mt-6 text-center">
            <p class="text-gray-500 text-sm">
                ليس لديك حساب؟
                <a href="{{ url_for('auth.register') }}" class="text-accent-400 hover:text-accent-300 font-medium transition">أنشئ حساباً جديداً</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
